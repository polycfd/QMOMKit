name: CI-Debug

on: 
# Runs on every push on main branch. If a push contains multiple commits, it will be ran on the latest one.
  push:
    # Runs on every push on main branch
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'examples/**'
    
# Cancels running instances when a pull request is updated by a commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: ${{github.event_name == 'pull_request'}}


env:
  COMPILE_JOBS: 8
  TEST_JOBS: 8

jobs:
  build:
    name: Build
    runs-on: self-hosted

    strategy:
      fail-fast: false
    
    steps:

      # Checks-out QMOMKit with branch of triggering commit
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Compile QMOMKit (Debug)
        run: |
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Debug -DQMOMKIT_BUILD_TESTS=ON
          cmake --build build-tests -j${{ env.COMPILE_JOBS}} 

      - name: Run QMOMKit tests (Debug)
        run: |
          ctest --test-dir build-tests --output-on-failure -j${{ env.TEST_JOBS }}

      # Performance instrumentation selects a different implementation of the
      # counters and compiles the counter assertions in the tests, neither of
      # which the build above contains. Without this step that configuration is
      # never built or run, and expectations in it go stale unnoticed.
      - name: Compile QMOMKit with performance instrumentation (Debug)
        run: |
          cmake -S . -B build-tests-instrumented -DCMAKE_BUILD_TYPE=Debug -DQMOMKIT_BUILD_TESTS=ON \
            -DQMOMKIT_ENABLE_PERFORMANCE_INSTRUMENTATION=ON
          cmake --build build-tests-instrumented -j${{ env.COMPILE_JOBS }}

      - name: Run QMOMKit tests with performance instrumentation (Debug)
        run: |
          ctest --test-dir build-tests-instrumented --output-on-failure -j${{ env.TEST_JOBS }} 
